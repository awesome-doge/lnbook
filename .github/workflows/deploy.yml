name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor
          gem install asciidoctor-diagram
          gem install rouge

      - name: Build HTML
        run: |
          mkdir -p docs
          asciidoctor \
            -D docs \
            -a toc=left \
            -a toclevels=3 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a source-highlighter=rouge \
            -a imagesdir=images \
            -a stem=latexmath \
            -o index.html \
            zh-TW/book.adoc
          cp -r images docs/
          cp -r callouts docs/
          cp zh-TW/style.css docs/ 2>/dev/null || true
          echo "lnbook-zh.doge.tg" > docs/CNAME

      - name: Inject SEO meta tags
        run: |
          # Replace BUILDDATE placeholder with actual date
          sed -i "s/BUILDDATE/$(date -Iseconds)/g" seo-template.html

          # Inject SEO content before </head> using Python
          python3 << 'EOF'
          with open('docs/index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          with open('seo-template.html', 'r', encoding='utf-8') as f:
              seo = f.read()
          html = html.replace('</head>', seo + '\n</head>', 1)
          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          EOF

          # Update page title
          sed -i 's|<title>[^<]*</title>|<title>精通閃電網路 - Mastering the Lightning Network 繁體中文版</title>|' docs/index.html

      - name: Generate sitemap and robots.txt
        run: |
          # Generate sitemap.xml
          cat > docs/sitemap.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"
                  xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"
                  xmlns:xhtml="http://www.w3.org/1999/xhtml">
            <url>
              <loc>https://lnbook-zh.doge.tg/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
              <xhtml:link rel="alternate" hreflang="zh-TW" href="https://lnbook-zh.doge.tg/"/>
              <xhtml:link rel="alternate" hreflang="en" href="https://github.com/lnbook/lnbook"/>
              <image:image>
                <image:loc>https://lnbook-zh.doge.tg/images/cover.png</image:loc>
                <image:title>精通閃電網路 Mastering the Lightning Network 封面</image:title>
              </image:image>
            </url>
          </urlset>
          EOF

          # Generate robots.txt
          cat > docs/robots.txt << 'EOF'
          # Robots.txt for 精通閃電網路
          User-agent: *
          Allow: /
          Sitemap: https://lnbook-zh.doge.tg/sitemap.xml

          # AI crawlers (for GEO)
          User-agent: GPTBot
          Allow: /
          User-agent: Google-Extended
          Allow: /
          User-agent: anthropic-ai
          Allow: /
          User-agent: PerplexityBot
          Allow: /
          User-agent: CCBot
          Allow: /

          Host: https://lnbook-zh.doge.tg
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
