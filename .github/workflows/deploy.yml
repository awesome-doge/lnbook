name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor
          gem install asciidoctor-diagram
          gem install rouge

      - name: Build HTML
        run: |
          mkdir -p docs
          asciidoctor \
            -D docs \
            -a toc=left \
            -a toclevels=3 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a source-highlighter=rouge \
            -a imagesdir=images \
            -a stem=latexmath \
            -o index.html \
            zh-TW/book.adoc
          cp -r images docs/
          cp -r callouts docs/
          cp zh-TW/style.css docs/ 2>/dev/null || true
          echo "lnbook-zh.doge.tg" > docs/CNAME

          # Add comprehensive SEO, AEO, GEO meta tags and structured data
          cat > docs/seo-inject.html << 'SEOHTML'
