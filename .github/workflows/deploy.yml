name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor
          gem install asciidoctor-diagram
          gem install rouge

      - name: Build HTML
        run: |
          mkdir -p docs
          asciidoctor \
            -D docs \
            -a toc=left \
            -a toclevels=3 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a source-highlighter=rouge \
            -a imagesdir=images \
            -a stem=latexmath \
            -o index.html \
            zh-TW/book.adoc
          cp -r images docs/
          cp -r callouts docs/
          cp zh-TW/style.css docs/ 2>/dev/null || true
          echo "lnbook-zh.doge.tg" > docs/CNAME

          # Add SEO meta tags, Open Graph, and Google Analytics
          sed -i 's|</head>|<!-- SEO Meta Tags -->\n<meta name="description" content="精通閃電網路 - 完整繁體中文翻譯。深入了解比特幣第二層擴展解決方案，包含支付通道、路由、HTLC 等核心概念。">\n<meta name="keywords" content="閃電網路, Lightning Network, 比特幣, Bitcoin, 區塊鏈, 支付通道, HTLC, 加密貨幣">\n<meta name="author" content="Andreas M. Antonopoulos, Olaoluwa Osuntokun, René Pickhardt">\n<meta name="robots" content="index, follow">\n<link rel="canonical" href="https://lnbook-zh.doge.tg/">\n\n<!-- Open Graph / Facebook -->\n<meta property="og:type" content="website">\n<meta property="og:url" content="https://lnbook-zh.doge.tg/">\n<meta property="og:title" content="精通閃電網路 - Mastering the Lightning Network 繁體中文版">\n<meta property="og:description" content="深入了解比特幣閃電網路的完整指南。涵蓋支付通道、路由機制、節點操作等核心技術。">\n<meta property="og:image" content="https://lnbook-zh.doge.tg/images/cover.png">\n<meta property="og:locale" content="zh_TW">\n\n<!-- Twitter -->\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:url" content="https://lnbook-zh.doge.tg/">\n<meta name="twitter:title" content="精通閃電網路 - Mastering the Lightning Network 繁體中文版">\n<meta name="twitter:description" content="深入了解比特幣閃電網路的完整指南。涵蓋支付通道、路由機制、節點操作等核心技術。">\n<meta name="twitter:image" content="https://lnbook-zh.doge.tg/images/cover.png">\n\n<!-- Google Analytics -->\n<script async src="https://www.googletagmanager.com/gtag/js?id=G-LDEV0N6689"></script>\n<script>\n  window.dataLayer = window.dataLayer \|\| [];\n  function gtag(){dataLayer.push(arguments);}\n  gtag("js", new Date());\n  gtag("config", "G-LDEV0N6689");\n</script>\n</head>|' docs/index.html

          # Update page title
          sed -i 's|<title>[^<]*</title>|<title>精通閃電網路 - Mastering the Lightning Network 繁體中文版</title>|' docs/index.html

          # Generate sitemap.xml
          cat > docs/sitemap.xml << 'SITEMAP'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://lnbook-zh.doge.tg/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>monthly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          SITEMAP
          sed -i "s/\$(date +%Y-%m-%d)/$(date +%Y-%m-%d)/" docs/sitemap.xml

          # Generate robots.txt
          cat > docs/robots.txt << 'ROBOTS'
          User-agent: *
          Allow: /
          Sitemap: https://lnbook-zh.doge.tg/sitemap.xml
          ROBOTS

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
