          # 精通閃電網路 - 完整 AI 參考文件
          # Mastering the Lightning Network - Full AI Reference

          本文件為 AI/LLM 提供更詳細的技術內容摘要。

          ## 術語表精選

          ### 地址 (Address)
          比特幣地址編碼了付款所需資訊，現代地址以 bc1 開頭（bech32 格式）。

          ### BOLT
          Basis of Lightning Technology，閃電網路的正式規範，確保不同實現間的互通性。

          ### 承諾交易 (Commitment Transaction)
          由兩個通道夥伴簽署的比特幣交易，編碼通道的最新餘額。

          ### HTLC
          雜湊時間鎖定合約，使用雜湊鎖（hashlock）和時間鎖（timelock）確保支付原子性。

          ### 流動性 (Liquidity)
          通道中可用於發送或接收支付的資金量。分為出境流動性和入境流動性。

          ### 洋蔥路由 (Onion Routing)
          多層加密路由機制，源自 Tor 網路，每個節點只能解密屬於自己的那一層。

          ### 支付通道 (Payment Channel)
          兩節點間的財務關係，透過多簽交易實現，允許無限次鏈下即時交易。

          ### 瞭望塔 (Watchtower)
          ��控通道狀態的服務，在對方試圖廣播舊狀態時進行懲罰。

          ## 常見問題解答

          Q: 閃電網路和比特幣主鏈的區別？
          A: 主鏈確認 10 分鐘、手續費數美元、每秒 7 筆；閃電網路毫秒級確認、手續費 < 1 聰、每秒百萬筆。

          Q: 如何獲取入境流動性？
          A: 與他人互開通道、使用 Lightning Pool 購買、透過 Loop 服務、或花費部分資金後自然產生。

          Q: 閃電網路安全嗎？
          A: 資金由比特幣腳本保護，欺詐行為會被懲罰（沒收全部通道資金），洋蔥路由確保隱私。

          Q: 推薦哪些閃電錢包？
          A: 非託管型推薦 Phoenix、Breez、Zeus；託管型有 Wallet of Satoshi；進階用戶可用 Umbrel 自建節點。

          ## 技術深入

          ### 通道生命週期
          1. 開啟：創建資金交易，鎖定 BTC 到 2-of-2 多簽
          2. 運營：交換簽名更新承諾交易，餘額即時變化
          3. 關閉：合作關閉（即時）或強制關閉（需等待時間鎖）

          ### HTLC 工作流程
          1. 接收者生成隨機數 R，計算 H = hash(R)
          2. 發送者創建 HTLC：「如果你能提供 R 使得 hash(R)=H，你可以領取這筆錢」
          3. 支付沿路徑傳播，每個節點創建相同條件的 HTLC
          4. 接收者揭露 R 領取資金，R 沿路徑回傳解鎖所有 HTLC

          ### 洋蔥路由結構
          - 使用 Sphinx 協議
          - 1300 位元組固定大小（最多 20 跳）
          - 每層加密包含：下一跳地址、金額、CLTV、加密的剩餘洋蔥

