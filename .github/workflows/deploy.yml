name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor
          gem install asciidoctor-diagram
          gem install rouge

      - name: Build HTML
        run: |
          mkdir -p docs
          asciidoctor \
            -D docs \
            -a toc=left \
            -a toclevels=3 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a source-highlighter=rouge \
            -a imagesdir=images \
            -a stem=latexmath \
            -o index.html \
            zh-TW/book.adoc
          cp -r images docs/
          cp -r callouts docs/
          cp zh-TW/style.css docs/ 2>/dev/null || true
          echo "lnbook-zh.doge.tg" > docs/CNAME

          # Add SEO meta tags, Open Graph, Schema.org, and Google Analytics
          sed -i 's|</head>|<!-- SEO Meta Tags -->\n<meta name="description" content="精通閃電網路 Mastering the Lightning Network 繁體中文版免費線上閱讀。完整介紹比特幣 Layer 2 擴展方案，涵蓋 LND、c-lightning、Eclair 節點架設教學，支付通道原理，HTLC 路由機制，洋蔥路由隱私保護。適合開發者與技術愛好者。">\n<meta name="keywords" content="閃電網路, Lightning Network, 比特幣, Bitcoin, 區塊鏈, blockchain, 支付通道, payment channel, HTLC, 加密貨幣, cryptocurrency, Layer 2, L2, LND, c-lightning, CLN, Eclair, 節點, node, 錢包, wallet, 微支付, micropayment, 即時支付, 洋蔥路由, onion routing, Mastering the Lightning Network, Andreas Antonopoulos, 比特幣閃電網路, 閃電網路教學, 閃電網路中文, 比特幣擴容, 比特幣二層">\n<meta name="author" content="Andreas M. Antonopoulos, Olaoluwa Osuntokun, René Pickhardt">\n<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">\n<link rel="canonical" href="https://lnbook-zh.doge.tg/">\n<meta name="googlebot" content="index, follow">\n<meta name="language" content="zh-TW">\n<meta name="geo.region" content="TW">\n<meta name="geo.placename" content="Taiwan">\n\n<!-- Open Graph / Facebook -->\n<meta property="og:type" content="book">\n<meta property="og:url" content="https://lnbook-zh.doge.tg/">\n<meta property="og:title" content="精通閃電網路 - Mastering the Lightning Network 繁體中文版 | 免費線上閱讀">\n<meta property="og:description" content="比特幣閃電網路完整技術指南繁體中文版。學習 Layer 2 擴展、支付通道、HTLC 路由、節點架設。O Reilly 原著授權翻譯。">\n<meta property="og:image" content="https://lnbook-zh.doge.tg/images/cover.png">\n<meta property="og:image:alt" content="精通閃電網路書籍封面">\n<meta property="og:locale" content="zh_TW">\n<meta property="og:site_name" content="精通閃電網路">\n<meta property="book:author" content="Andreas M. Antonopoulos">\n<meta property="book:author" content="Olaoluwa Osuntokun">\n<meta property="book:author" content="René Pickhardt">\n<meta property="book:tag" content="Bitcoin">\n<meta property="book:tag" content="Lightning Network">\n<meta property="book:tag" content="Cryptocurrency">\n\n<!-- Twitter -->\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:url" content="https://lnbook-zh.doge.tg/">\n<meta name="twitter:title" content="精通閃電網路 - Mastering the Lightning Network 繁體中文版">\n<meta name="twitter:description" content="比特幣閃電網路技術指南。免費線上閱讀，涵蓋 LND/c-lightning 節點架設、支付通道、HTLC 路由機制。">\n<meta name="twitter:image" content="https://lnbook-zh.doge.tg/images/cover.png">\n<meta name="twitter:image:alt" content="精通閃電網路書籍封面">\n\n<!-- Schema.org Structured Data -->\n<script type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@type": "Book",\n  "name": "精通閃電網路 - Mastering the Lightning Network",\n  "alternateName": "Mastering the Lightning Network",\n  "description": "比特幣閃電網路完整技術指南繁體中文版。涵蓋 Layer 2 擴展方案、支付通道、HTLC、洋蔥路由等核心技術。",\n  "inLanguage": "zh-TW",\n  "author": [\n    {"@type": "Person", "name": "Andreas M. Antonopoulos"},\n    {"@type": "Person", "name": "Olaoluwa Osuntokun"},\n    {"@type": "Person", "name": "René Pickhardt"}\n  ],\n  "translator": {"@type": "Person", "name": "Dr. Awesome Doge"},\n  "publisher": {"@type": "Organization", "name": "O Reilly Media"},\n  "datePublished": "2021-12-21",\n  "url": "https://lnbook-zh.doge.tg/",\n  "image": "https://lnbook-zh.doge.tg/images/cover.png",\n  "genre": ["Technology", "Cryptocurrency", "Bitcoin"],\n  "about": [\n    {"@type": "Thing", "name": "Lightning Network"},\n    {"@type": "Thing", "name": "Bitcoin"},\n    {"@type": "Thing", "name": "Cryptocurrency"},\n    {"@type": "Thing", "name": "Blockchain"}\n  ],\n  "keywords": "閃電網路, Lightning Network, 比特幣, Bitcoin, Layer 2, HTLC, 支付通道",\n  "license": "https://creativecommons.org/licenses/by-sa/4.0/"\n}\n</script>\n<script type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@type": "WebSite",\n  "name": "精通閃電網路",\n  "url": "https://lnbook-zh.doge.tg/",\n  "description": "Mastering the Lightning Network 繁體中文翻譯",\n  "inLanguage": "zh-TW"\n}\n</script>\n\n<!-- Google Analytics -->\n<script async src="https://www.googletagmanager.com/gtag/js?id=G-LDEV0N6689"></script>\n<script>\n  window.dataLayer = window.dataLayer \|\| [];\n  function gtag(){dataLayer.push(arguments);}\n  gtag("js", new Date());\n  gtag("config", "G-LDEV0N6689");\n</script>\n</head>|' docs/index.html

          # Update page title
          sed -i 's|<title>[^<]*</title>|<title>精通閃電網路 - Mastering the Lightning Network 繁體中文版</title>|' docs/index.html

          # Generate sitemap.xml
          cat > docs/sitemap.xml << 'SITEMAP'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://lnbook-zh.doge.tg/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>monthly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          SITEMAP
          sed -i "s/\$(date +%Y-%m-%d)/$(date +%Y-%m-%d)/" docs/sitemap.xml

          # Generate robots.txt
          cat > docs/robots.txt << 'ROBOTS'
          User-agent: *
          Allow: /
          Sitemap: https://lnbook-zh.doge.tg/sitemap.xml
          ROBOTS

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
