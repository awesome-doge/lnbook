name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor
          gem install asciidoctor-diagram

      - name: Build HTML
        run: |
          mkdir -p docs
          asciidoctor \
            -D docs \
            -a toc=left \
            -a toclevels=3 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a source-highlighter=highlight.js \
            -a imagesdir=images \
            -o index.html \
            zh-TW/book.adoc
          cp -r images docs/
          cp zh-TW/style.css docs/ 2>/dev/null || true
          echo "lnbook-zh.doge.tg" > docs/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
