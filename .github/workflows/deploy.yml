name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup Node.js (for Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Asciidoctor and dependencies
        run: |
          gem install asciidoctor
          gem install asciidoctor-diagram
          gem install rouge
          gem install asciidoctor-epub3
          gem install asciidoctor-pdf
          gem install asciidoctor-multipage
          gem install citeproc-ruby csl-styles
          npm install -g pagefind

      - name: Build HTML
        run: |
          mkdir -p docs
          asciidoctor \
            -D docs \
            -a toc=left \
            -a toclevels=2 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a source-highlighter=rouge \
            -a imagesdir=images \
            -a stem=latexmath \
            -a docinfo=shared \
            -o index.html \
            zh-TW/book.adoc
          cp -r images docs/
          cp -r callouts docs/
          cp zh-TW/style.css docs/ 2>/dev/null || true
          cp sw.js docs/ 2>/dev/null || true
          cp manifest.json docs/ 2>/dev/null || true
          cp images/cover.png docs/favicon.png 2>/dev/null || true
          echo "lnbook-zh.doge.tg" > docs/CNAME

      - name: Build multipage HTML (SEO - each chapter gets own URL)
        run: |
          mkdir -p docs/chapter
          asciidoctor -r asciidoctor-multipage \
            -b multipage_html5 \
            -D docs/chapter \
            -a toc=left \
            -a toclevels=2 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a source-highlighter=rouge \
            -a imagesdir=../images \
            -a stem=latexmath \
            -a multipage-level=1 \
            zh-TW/book.adoc 2>&1 || true

          # Copy assets to chapter directory so relative paths work
          cp zh-TW/style.css docs/chapter/ 2>/dev/null || true
          cp sw.js docs/chapter/ 2>/dev/null || true
          cp manifest.json docs/chapter/ 2>/dev/null || true

          CHAPTER_COUNT=$(ls docs/chapter/*.html 2>/dev/null | wc -l)
          echo "Multipage: ${CHAPTER_COUNT} HTML files generated"
          ls docs/chapter/*.html 2>/dev/null | head -20
        continue-on-error: true

      - name: Inject SEO meta tags
        run: |
          # Replace BUILDDATE placeholder with actual date
          sed -i "s/BUILDDATE/$(date -Iseconds)/g" seo-template.html

          # Inject SEO content before </head> using Python
          python3 << 'EOF'
          with open('docs/index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          with open('seo-template.html', 'r', encoding='utf-8') as f:
              seo = f.read()
          html = html.replace('</head>', seo + '\n</head>', 1)
          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          EOF

          # Update page title
          sed -i 's|<title>[^<]*</title>|<title>精通閃電網路 - Mastering the Lightning Network 繁體中文版</title>|' docs/index.html

          # Remove unused Asciidoctor default Google Fonts (Open Sans, Noto Serif, Droid Sans Mono)
          # We use Noto Sans TC + JetBrains Mono loaded via docinfo.html instead
          sed -i '/fonts\.googleapis\.com\/css?family=Open+Sans/d' docs/index.html

          # Patch Asciidoctor inline CSS for dark mode compatibility
          # Remove hardcoded dark-on-light colors that break dark mode
          python3 << 'PATCHEOF'
          with open('docs/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          # These replacements target the Asciidoctor inline <style> block
          # Replace hardcoded rgba(0,0,0,...) text colors with CSS variable references
          replacements = [
              # body text color
              ('color:rgba(0,0,0,.8)', 'color:var(--ln-text, rgba(0,0,0,.8))'),
              ('color:rgba(0,0,0,.85)', 'color:var(--ln-text, rgba(0,0,0,.85))'),
              ('color:rgba(0,0,0,.9)', 'color:var(--ln-text, rgba(0,0,0,.9))'),
              ('color:rgba(0,0,0,.6)', 'color:var(--ln-text-light, rgba(0,0,0,.6))'),
              # background colors that break dark mode
              ('background:#fff', 'background:var(--ln-bg, #fff)'),
              ('background:#f7f8f7', 'background:var(--ln-bg-alt, #f7f8f7)'),
              ('background:#f8f8f7', 'background:var(--ln-bg-alt, #f8f8f7)'),
              # heading red color
              ('color:#ba3925', 'color:var(--ln-text, #ba3925)'),
              # .title red color
              ('color:#7a2518', 'color:var(--ln-text-light, #7a2518)'),
              # link colors
              ('color:#2156a5', 'color:var(--ln-secondary, #2156a5)'),
              ('color:#1d4b8f', 'color:var(--ln-secondary-dark, #1d4b8f)'),
              # border colors
              ('border:0 solid #dedede', 'border:0 solid var(--ln-border, #dedede)'),
          ]

          for old, new in replacements:
              count = html.count(old)
              if count > 0:
                  html = html.replace(old, new)
                  print(f"  Replaced {count}x: {old[:40]}")

          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(html)

          print("Asciidoctor inline CSS patched for dark mode")
          PATCHEOF

          # Lazy-load MathJax: only load when .stemblock elements exist on page
          # Replace the eager MathJax <script src=...> with a deferred loader
          python3 << 'MATHEOF'
          with open('docs/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          # Find and replace the MathJax CDN script tag with lazy loader
          mathjax_cdn = '<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML"></script>'
          lazy_mathjax = '''<script>
          // Lazy-load MathJax only when math content exists
          if (document.querySelector('.stemblock, .math')) {
            var s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML';
            s.async = true;
            document.body.appendChild(s);
          }
          </script>'''

          if mathjax_cdn in html:
              html = html.replace(mathjax_cdn, lazy_mathjax)
              print("MathJax converted to lazy loading")
          else:
              print("MathJax CDN tag not found (may have different URL)")

          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          MATHEOF

          # Add loading="lazy" and decoding="async" to all images at build time
          # This is more effective than JS-based lazy loading since the browser
          # knows about it before starting image downloads
          python3 << 'LAZYEOF'
          import re
          with open('docs/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          count = 0
          def add_lazy(match):
              global count
              tag = match.group(0)
              if 'loading=' in tag:
                  return tag
              tag = tag.replace('<img ', '<img loading="lazy" decoding="async" ', 1)
              count += 1
              return tag

          html = re.sub(r'<img\s', add_lazy, html)
          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print(f"Added lazy loading to {count} images")
          LAZYEOF

      - name: Inject build version and English cross-references
        run: |
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M')
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_HASH_FULL=$(git rev-parse HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)

          python3 << PYEOF
          import re

          with open('docs/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          # --- Inject build info into footer ---
          build_info = '''
          <div id="build-info" style="margin-top:1rem;padding-top:1rem;border-top:1px solid #e2e8f0;font-size:0.8rem;color:#999;">
            <p>建置時間：${BUILD_DATE} | 版本：<a href="https://github.com/lnbook/lnbook/commit/${GIT_HASH_FULL}" target="_blank" rel="noopener">${GIT_HASH}</a> | 提交 #${COMMIT_COUNT}</p>
            <p>
              <a href="mastering-lightning-network-zh-TW.epub" download>📖 下載 EPUB</a> &nbsp;|&nbsp;
              <a href="mastering-lightning-network-zh-TW.pdf" download>📄 下載 PDF</a> &nbsp;|&nbsp;
              <a href="https://github.com/lnbook/lnbook" target="_blank" rel="noopener">📦 GitHub 原始碼</a>
            </p>
          </div>
          '''

          build_info = build_info.replace('$' + '{BUILD_DATE}', '${BUILD_DATE}')
          build_info = build_info.replace('$' + '{GIT_HASH_FULL}', '${GIT_HASH_FULL}')
          build_info = build_info.replace('$' + '{GIT_HASH}', '${GIT_HASH}')
          build_info = build_info.replace('$' + '{COMMIT_COUNT}', '${COMMIT_COUNT}')

          # Inject build-info inside the #footer div, after #footer-text
          import re
          footer_pattern = r'(<div id="footer-text">.*?</div>)'
          match = re.search(footer_pattern, html, re.DOTALL)
          if match:
              html = html[:match.end()] + '\n' + build_info + html[match.end():]
          elif '<div id="footer">' in html:
              html = html.replace('<div id="footer">', '<div id="footer">\n' + build_info, 1)

          # --- Inject English chapter cross-reference links ---
          # Map zh-TW chapter files to English originals on GitHub
          chapter_map = {
              '_簡介': ('01_introduction.asciidoc', '第 1 章'),
              '_入門': ('02_getting_started.asciidoc', '第 2 章'),
              '_閃電網路的運作原理': ('03_how_ln_works.asciidoc', '第 3 章'),
              '_閃電網路節點軟體': ('04_node_client.asciidoc', '第 4 章'),
              '_操作閃電網路節點': ('05_node_operations.asciidoc', '第 5 章'),
              '_閃電網路架構': ('06_lightning_architecture.asciidoc', '第 6 章'),
              '_支付通道': ('07_payment_channels.asciidoc', '第 7 章'),
              '_路由htlc': ('08_routing_htlcs.asciidoc', '第 8 章'),
              '_通道操作與支付轉發': ('09_channel_operation.asciidoc', '第 9 章'),
              '_洋蔥路由': ('10_onion_routing.asciidoc', '第 10 章'),
              '_gossip_與通道圖': ('11_gossip_channel_graph.asciidoc', '第 11 章'),
              '_路徑尋找與支付傳遞': ('12_path_finding.asciidoc', '第 12 章'),
              '_有線協議': ('13_wire_protocol.asciidoc', '第 13 章'),
              '_閃電網路加密傳輸': ('14_encrypted_transport.asciidoc', '第 14 章'),
              '_支付請求': ('15_payment_requests.asciidoc', '第 15 章'),
              '_閃電網路中的安全性和隱私性': ('16_security_privacy_ln.asciidoc', '第 16 章'),
              '_結論': ('17_conclusion.asciidoc', '第 17 章'),
          }

          base_url = 'https://github.com/lnbook/lnbook/blob/develop/'

          for anchor_id, (en_file, ch_label) in chapter_map.items():
              # Find the h2 with this id and add a small link after it
              pattern = f'id="{anchor_id}"'
              if pattern in html:
                  en_link = f'<a href="{base_url}{en_file}" target="_blank" rel="noopener" class="en-source-link" style="font-size:0.75rem;color:#999;margin-left:0.5rem;font-weight:400;vertical-align:middle;" title="View English original">📖 English</a>'
                  # Insert link right before the closing </h2> tag after this id
                  html = html.replace(
                      f'id="{anchor_id}"',
                      f'id="{anchor_id}" data-en-source="{en_file}"',
                      1
                  )

          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          PYEOF

          # Now do shell variable substitution on the build info we injected
          sed -i "s|\${BUILD_DATE}|${BUILD_DATE}|g" docs/index.html
          sed -i "s|\${GIT_HASH_FULL}|${GIT_HASH_FULL}|g" docs/index.html
          sed -i "s|\${GIT_HASH}|${GIT_HASH}|g" docs/index.html
          sed -i "s|\${COMMIT_COUNT}|${COMMIT_COUNT}|g" docs/index.html

      - name: Optimize images
        run: |
          # Install image optimization tools
          sudo apt-get install -y -qq optipng jpegoptim imagemagick > /dev/null 2>&1

          # Create optimized OG social sharing image (1200x630, <300KB)
          if [ -f docs/images/cover.png ]; then
            convert docs/images/cover.png \
              -resize 1200x630^ \
              -gravity center \
              -extent 1200x630 \
              -quality 85 \
              docs/images/og-cover.jpg 2>/dev/null || true
            echo "OG image: $(ls -lh docs/images/og-cover.jpg 2>/dev/null || echo 'failed')"
          fi

          # Optimize PNGs (lossless)
          find docs/images -name '*.png' -exec optipng -quiet -o2 {} \; 2>/dev/null || true

          # Optimize JPEGs (quality 85)
          find docs/images -name '*.jpg' -o -name '*.jpeg' | xargs -r jpegoptim --quiet --max=85 --strip-all 2>/dev/null || true

          echo "=== Image optimization complete ==="
          du -sh docs/images/

      - name: Build Pagefind search index
        run: |
          pagefind \
            --site docs \
            --glob "index.html" \
            --root-selector "#content"
          echo "=== Pagefind index built ==="
          ls -lh docs/pagefind/

          # Copy pagefind to chapter directory so multipage pages can use search
          cp -r docs/pagefind docs/chapter/pagefind 2>/dev/null || true

      - name: Build EPUB
        run: |
          asciidoctor-epub3 \
            -D docs \
            -a toc \
            -a toclevels=2 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a imagesdir=images \
            -a source-highlighter=rouge \
            -a stem=latexmath \
            -o mastering-lightning-network-zh-TW.epub \
            zh-TW/book.adoc
        continue-on-error: true

      - name: Build PDF (Chrome headless - full CJK support)
        run: |
          # Install CJK fonts and Chrome
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra > /dev/null 2>&1

          # Build a print-optimized HTML for PDF conversion
          asciidoctor \
            -D /tmp \
            -a toc=left \
            -a toclevels=2 \
            -a sectnums \
            -a sectnumlevels=3 \
            -a icons=font \
            -a source-highlighter=rouge \
            -a imagesdir=$(pwd)/images \
            -a stem=latexmath \
            -a docinfo=shared \
            -o pdf-source.html \
            zh-TW/book.adoc

          # Inject print-specific CSS into the HTML
          python3 << 'PDFCSS'
          with open('/tmp/pdf-source.html', 'r', encoding='utf-8') as f:
              html = f.read()

          print_css = '''<style>
          @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
          body { font-family: "Noto Sans TC", sans-serif !important; font-size: 11pt !important; line-height: 1.7 !important; color: #333 !important; }
          #toc { display: none !important; }
          #content { max-width: 100% !important; margin: 0 !important; padding: 20px 40px !important; }
          h1,h2,h3,h4,h5,h6 { font-family: "Noto Sans TC", sans-serif !important; color: #2c3e50 !important; page-break-after: avoid !important; }
          h1 { font-size: 24pt !important; color: #f7931a !important; border-bottom: 2px solid #f7931a !important; }
          h2 { font-size: 18pt !important; border-bottom: 1px solid #ddd !important; }
          pre { page-break-inside: avoid !important; font-size: 9pt !important; }
          .imageblock { page-break-inside: avoid !important; }
          .admonitionblock { page-break-inside: avoid !important; }
          table { page-break-inside: avoid !important; }
          a { color: #4a90d9 !important; }
          #reading-progress, #back-to-top, #toc-toggle, #toc-overlay, #search-toggle, #search-modal, #chapter-nav { display: none !important; }
          @page { margin: 20mm 15mm; size: A4; }
          @page :first { margin-top: 0; }
          </style>'''

          html = html.replace('</head>', print_css + '\n</head>', 1)
          with open('/tmp/pdf-source.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print("Print CSS injected")
          PDFCSS

          # Use Chrome headless to generate PDF
          # Chrome on GitHub Actions runners is pre-installed
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium-browser || echo "")
          if [ -z "$CHROME" ]; then
            echo "Installing Chrome..."
            sudo apt-get install -y -qq google-chrome-stable > /dev/null 2>&1 || \
            sudo apt-get install -y -qq chromium-browser > /dev/null 2>&1
            CHROME=$(which google-chrome-stable || which google-chrome || which chromium-browser)
          fi

          echo "Using: $CHROME"

          "$CHROME" \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --print-to-pdf=docs/mastering-lightning-network-zh-TW.pdf \
            --no-pdf-header-footer \
            --print-to-pdf-no-header \
            /tmp/pdf-source.html 2>&1 || true

          if [ -f docs/mastering-lightning-network-zh-TW.pdf ]; then
            PDF_SIZE=$(ls -lh docs/mastering-lightning-network-zh-TW.pdf | awk '{print $5}')
            echo "PDF generated: ${PDF_SIZE}"
          else
            echo "Chrome PDF failed, falling back to asciidoctor-pdf..."
            asciidoctor-pdf \
              -D docs \
              -a toc -a toclevels=2 -a sectnums -a icons=font \
              -a imagesdir=images -a source-highlighter=rouge \
              -a scripts=cjk -a stem=latexmath \
              -a pdf-theme=zh-TW/pdf-theme.yml \
              -o mastering-lightning-network-zh-TW.pdf \
              zh-TW/book.adoc 2>&1 || true
          fi
        continue-on-error: true

      - name: List generated ebooks
        run: |
          echo "=== Generated files in docs/ ==="
          ls -lh docs/*.epub docs/*.pdf 2>/dev/null || echo "Some ebook formats may have failed"

      - name: Create download page
        run: |
          # Create a simple download metadata file
          cat > docs/downloads.json << DLEOF
          {
            "formats": {
              "html": {
                "url": "https://lnbook-zh.doge.tg/",
                "description": "線上閱讀 (HTML)"
              },
              "epub": {
                "url": "https://lnbook-zh.doge.tg/mastering-lightning-network-zh-TW.epub",
                "filename": "mastering-lightning-network-zh-TW.epub",
                "description": "EPUB 電子書 (適用於大多數電子書閱讀器)"
              },
              "pdf": {
                "url": "https://lnbook-zh.doge.tg/mastering-lightning-network-zh-TW.pdf",
                "filename": "mastering-lightning-network-zh-TW.pdf",
                "description": "PDF 電子書 (適用於列印和桌面閱讀)"
              }
            },
            "updated": "$(date -Iseconds)"
          }
          DLEOF

      - name: Generate sitemap, 404 page, and robots.txt
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Auto-generate sitemap from actual HTML anchors
          python3 << SMEOF
          import re
          from urllib.parse import quote

          with open('docs/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          base = 'https://lnbook-zh.doge.tg'
          today = '${TODAY}'

          # Extract all h2 ids (chapters)
          h2_ids = re.findall(r'<h2 id="([^"]+)"', html)

          urls = []

          # Main page
          urls.append(f'''  <url>
            <loc>{base}/</loc>
            <lastmod>{today}</lastmod>
            <changefreq>weekly</changefreq>
            <priority>1.0</priority>
            <xhtml:link rel="alternate" hreflang="zh-TW" href="{base}/"/>
            <xhtml:link rel="alternate" hreflang="en" href="https://github.com/lnbook/lnbook"/>
            <image:image>
              <image:loc>{base}/images/cover.png</image:loc>
              <image:title>精通閃電網路 Mastering the Lightning Network</image:title>
            </image:image>
          </url>''')

          # Ebook downloads
          for fmt in ['epub', 'pdf']:
              urls.append(f'''  <url>
            <loc>{base}/mastering-lightning-network-zh-TW.{fmt}</loc>
            <lastmod>{today}</lastmod>
            <changefreq>monthly</changefreq>
            <priority>0.7</priority>
          </url>''')

          # Multipage chapter URLs (real URLs that Google can index individually)
          import os, glob
          chapter_files = sorted(glob.glob('docs/chapter/*.html'))
          for i, fpath in enumerate(chapter_files):
              fname = os.path.basename(fpath)
              pri = '0.95' if fname == 'index.html' else '0.9' if i < 6 else '0.85' if i < 13 else '0.8'
              urls.append(f'''  <url>
            <loc>{base}/chapter/{fname}</loc>
            <lastmod>{today}</lastmod>
            <changefreq>monthly</changefreq>
            <priority>{pri}</priority>
          </url>''')

          # Single-page fragment URLs (secondary, for completeness)
          for i, h2id in enumerate(h2_ids):
              encoded = quote(h2id, safe='')
              urls.append(f'''  <url>
            <loc>{base}/#{encoded}</loc>
            <lastmod>{today}</lastmod>
            <changefreq>monthly</changefreq>
            <priority>0.6</priority>
          </url>''')

          sitemap = f'''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"
                  xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"
                  xmlns:xhtml="http://www.w3.org/1999/xhtml">
          {chr(10).join(urls)}
          </urlset>'''

          with open('docs/sitemap.xml', 'w', encoding='utf-8') as f:
              f.write(sitemap)

          print(f"Sitemap: {len(urls)} URLs ({len(chapter_files)} chapter pages + {len(h2_ids)} fragments)")
          SMEOF

          # Generate custom 404 page
          cat > docs/404.html << 'FOUREOF'
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>找不到頁面 - 精通閃電網路</title>
          <style>
          body { font-family: "Noto Sans TC", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #1a202c; color: #e2e8f0; }
          .box { text-align: center; max-width: 480px; padding: 2rem; }
          h1 { font-size: 4rem; color: #f7931a; margin: 0; }
          p { font-size: 1.1rem; line-height: 1.8; color: #a0aec0; }
          a { color: #63b3ed; text-decoration: none; }
          a:hover { text-decoration: underline; }
          .btn { display: inline-block; margin-top: 1.5rem; padding: 0.8rem 2rem; background: #f7931a; color: #fff; border-radius: 8px; font-weight: 700; font-size: 1rem; }
          .btn:hover { background: #e07b00; text-decoration: none; }
          </style>
          </head>
          <body>
          <div class="box">
