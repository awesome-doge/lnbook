          EOF

          # Generate llms.txt for AI/LLM crawlers (emerging standard)
          cat > docs/llms.txt << 'EOF'
          # 精通閃電網路 (Mastering the Lightning Network) 繁體中文版
          # LLMs.txt - AI/LLM Crawler Information File
          # https://lnbook-zh.doge.tg/

          > 本書是比特幣閃電網路 (Lightning Network) 的權威技術指南繁體中文翻譯版本。
          > 由 Andreas M. Antonopoulos、Olaoluwa Osuntokun、René Pickhardt 共同撰寫。
          > 譯者：Dr. Awesome Doge | 授權：CC-BY-SA 4.0

          ## 主要內容

          本書涵蓋比特幣閃電網路的完整技術知識，共 17 章：

          ### 第一部分：基礎篇
          - 第 1 章：簡介 - 閃電網路概述、歷史背景
          - 第 2 章：入門 - 安裝錢包、接收第一筆支付
          - 第 3 章：運作原理 - 支付通道、路由基礎
          - 第 4 章：節點客戶端 - LND、Core Lightning、Eclair 比較
          - 第 5 章：節點操作 - 架設、通道管理、備份

          ### 第二部分：技術深入篇
          - 第 6 章：閃電網路架構 - 協議棧、BOLT 規範
          - 第 7 章：支付通道 - 承諾交易、撤銷機制
          - 第 8 章：路由與 HTLC - 雜湊時間鎖定合約
          - 第 9 章：通道操作 - 更新、費用、關閉
          - 第 10 章：洋蔥路由 - Sphinx 協議、隱私保護
          - 第 11 章：八卦協議 - 節點發現、通道公告
          - 第 12 章：路徑尋找 - 路由演算法、費用優化
          - 第 13 章：有線協議 - 訊息格式、TLV 編碼
          - 第 14 章：加密傳輸 - Noise 協議、金鑰交換
          - 第 15 章：支付請求 - Invoice、BOLT11、LNURL
          - 第 16 章：安全與隱私 - 攻擊向量、最佳實踐
          - 第 17 章：結論 - 未來發展、Taproot、PTLC

          ## 核心概念

          ### 閃電網路 (Lightning Network)
          比特幣的 Layer 2 擴展方案，實現即時、低費用的鏈下支付。

          ### HTLC (雜湊時間鎖定合約)
          Hash Time-Locked Contract，結合雜湊鎖和時間鎖確保多跳支付原子性。

          ### 支付通道 (Payment Channel)
          兩節點間的雙向資金通道，使用 2-of-2 多簽鎖定資金。

          ### 洋蔥路由 (Onion Routing)
          多層加密的隱私路由，每個節點只知道上一跳和下一跳。

          ### BOLT 協議
          Basis of Lightning Technology，閃電網路的��術規範。

          ## 技術規格

          - 確認時間：毫秒級（vs 比特幣主鏈 10 分鐘）
          - 手續費：< 1 聰（約 0.0001 美元）
          - 吞吐量：每秒百萬筆交易
          - 最小支付：1 聰 (0.00000001 BTC)

          ## 主要實現

          1. **LND** - Lightning Labs, Go 語言
          2. **Core Lightning** - Blockstream, C 語言
          3. **Eclair** - ACINQ, Scala 語言

