<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": "https://lnbook-zh.doge.tg/#faq",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "什麼是閃電網路 (Lightning Network)？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "閃電網路是比特幣的 Layer 2 擴展方案，透過建立支付通道實現即時、低費用的鏈下交易。它使用 HTLC（雜湊時間鎖定合約）確保交易安全，支援每秒數百萬筆交易，適合微支付和日常消費場景。閃電網路於 2018 年主網上線，目前已有超過 5,000 個節點和 60,000 個通道。"
      }
    },
    {
      "@type": "Question",
      "name": "閃電網路如何運作？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "閃電網路運作原理：1) 兩方在比特幣主鏈開啟支付通道，鎖定資金；2) 雙方可在通道內進行無限次即時交易，無需等待區塊確認；3) 透過 HTLC 路由機制，即使沒有直接通道也能透過中間節點轉帳；4) 關閉通道時，最終餘額才會寫入比特幣主鏈。整個過程由密碼學確保安全。"
      }
    },
    {
      "@type": "Question",
      "name": "如何架設閃電網路節點？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "架設閃電網路節點步驟：1) 準備硬體（樹莓派或 VPS，至少 8GB RAM）；2) 同步比特幣全節點；3) 選擇並安裝閃電網路實現（LND、Core Lightning 或 Eclair）；4) 配置節點並開放端口；5) 創建錢包並備份種子詞；6) 開啟通道並注入流動性。推薦初學者使用 Umbrel 或 RaspiBlitz 等一鍵安裝方案。"
      }
    },
    {
      "@type": "Question",
      "name": "閃電網路支付通道是什麼？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "支付通道是兩個節點間建立的雙向資金通道。開啟通道需要一筆鏈上交易鎖定資金到 2-of-2 多簽地址。通道開啟後，雙方可進行無數次鏈下交易，每次只需交換簽名訊息，速度極快（毫秒級）且幾乎零手續費。通道容量決定了最大單筆支付金額，目前無上限但建議不超過 0.1 BTC。"
      }
    },
    {
      "@type": "Question",
      "name": "什麼是 HTLC（雜湊時間鎖定合約）？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "HTLC（Hash Time-Locked Contract，雜湊時間鎖定合約）是閃電網路的核心機制。它結合雜湊鎖和時間鎖：收款方必須在時限內提供正確的原像（preimage）才能領取款項，否則資金退回付款方。HTLC 確保多跳路由支付的原子性——要麼全部成功，要麼全部失敗，資金不會卡在中間節點。"
      }
    },
    {
      "@type": "Question",
      "name": "閃電網路的主要實現有哪些？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "三大主流閃電網路實現：1) LND (Lightning Network Daemon) - Lightning Labs 開發，Go 語言，市佔率最高，API 完善；2) Core Lightning (c-lightning) - Blockstream 開發，C 語言，輕量高效，插件系統靈活；3) Eclair - ACINQ 開發，Scala 語言，支援行動端，Phoenix 錢包的後端。三者都遵循 BOLT 規範，可互相通訊。"
      }
    },
    {
      "@type": "Question",
      "name": "閃電網路安全嗎？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "閃電網路的安全性由多重機制保障：1) 資金由比特幣腳本保護，任何欺詐行為會被懲罰（沒收全部通道資金）；2) 洋蔥路由確保支付路徑隱私，中間節點無法得知交易全貌；3) HTLC 確保原子性交易；4) 瞭望塔服務可監控離線時的通道狀態。主要風險來自節點熱錢包管理和通道強制關閉時的時間鎖等待。"
      }
    },
    {
      "@type": "Question",
      "name": "閃電網路手續費多少？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "閃電網路手續費極低，通常每筆支付僅需 1-10 聰（satoshi），約等於 0.0001-0.001 美元。費用組成：基本費（base fee，通常 0-1 聰）+ 費率（fee rate，通常 0.0001%-0.01% 的支付金額）。相比比特幣主鏈數美元的手續費，閃電網路便宜 1000 倍以上，特別適合小額支付。"
      }
    },
    {
      "@type": "Question",
      "name": "什麼是洋蔥路由 (Onion Routing)？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "洋蔥路由是閃電網路的隱私保護機制，源自 Tor 網路的設計。支付資訊被層層加密（像洋蔥），每個路由節點只能解密屬於自己的那一層，知道「從哪來、往哪去」，但無法得知完整路徑或最終收款人。這確保了交易隱私，即使路由節點也無法監控或審查特定用戶的支付行為。"
      }
    },
    {
      "@type": "Question",
      "name": "這本書適合什麼程度的讀者？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "《精通閃電網路》適合具備比特幣基礎知識的讀者。書籍分為兩大部分：基礎篇（第1-5章）適合一般用戶，介紹概念和錢包使用；技術深入篇（第6-17章）適合開發者，深入協議細節和實現。建議先閱讀《精通比特幣》建立基礎。本書提供完整的 Docker 環境，讓讀者實際操作閃電網路節點。"
      }
    }
  ]
}
</script>

