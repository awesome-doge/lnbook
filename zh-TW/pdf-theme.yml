extends: default-with-font-fallbacks
font:
  catalog:
    merge: true
    Noto Sans TC:
      normal: NotoSansCJK-Regular-TC.otf
      bold: NotoSansCJK-Bold-TC.otf
      italic: NotoSansCJK-Regular-TC.otf
      bold_italic: NotoSansCJK-Bold-TC.otf
    Noto Serif TC:
      normal: NotoSerifCJK-Regular-TC.otf
      bold: NotoSerifCJK-Bold-TC.otf
      italic: NotoSerifCJK-Regular-TC.otf
      bold_italic: NotoSerifCJK-Bold-TC.otf
page:
  layout: portrait
  margin: [25mm, 20mm, 25mm, 20mm]
  size: A4
base:
  font-family: Noto Sans TC
  font-size: 10.5
  line-height-length: 18
  line-height: $base_line_height_length / $base_font_size
  font-color: #333333
title-page:
  align: center
  font-size: 27
  font-color: #f7931a
  title:
    font-family: Noto Sans TC
    top: 40%
    font-size: 36
    font-color: #f7931a
    line-height: 1.2
  subtitle:
    font-size: 18
    font-color: #666666
    margin-top: 12
  authors:
    font-size: 14
    font-color: #444444
    margin-top: 18
heading:
  font-family: Noto Sans TC
  font-color: #2c3e50
  h1-font-size: 24
  h2-font-size: 20
  h3-font-size: 16
  h4-font-size: 14
  line-height: 1.3
  margin-top: 18
  margin-bottom: 12
  chapter:
    break-before: always
link:
  font-color: #4a90d9
code:
  font-family: M+ 1mn
  font-size: 9
  line-height: 1.4
  padding: [4, 8, 4, 8]
  background-color: #f6f8fa
  border-color: #e2e8f0
  border-radius: 3
  border-width: 0.5
codespan:
  font-family: $code_font_family
  font-size: 9.5
  font-color: #c7254e
  background-color: #f6f8fa
  border-radius: 2
quote:
  border-color: #f7931a
  border-width: 3
  padding: [0, 12, 0, 14]
  cite-font-color: #999999
sidebar:
  background-color: #f8f9fa
  border-color: #e2e8f0
  border-radius: 4
  border-width: 0.5
  padding: [12, 12, 12, 12]
  title:
    font-color: #f7931a
    font-size: 13
    font-style: bold
admonition:
  padding: [8, 12, 8, 12]
  border-radius: 4
  column-rule-color: #e2e8f0
table:
  border-color: #e2e8f0
  border-width: 0.5
  head:
    background-color: #f8f9fa
    font-style: bold
  cell-padding: [5, 8, 5, 8]
  body:
    stripe-background-color: #fafbfc
image:
  align: center
toc:
  font-family: Noto Sans TC
  line-height: 1.6
  indent: 16
  h2-font-size: 12
  h3-font-size: 10
  dot-leader:
    font-color: #cccccc
header:
  height: 0
footer:
  font-family: Noto Sans TC
  height: 18mm
  font-size: 8
  font-color: #999999
  recto:
    center:
      content: '{page-number}'
  verso:
    center:
      content: '{page-number}'
