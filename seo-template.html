        "@type": "Answer",

      }
    },
    {
      "@type": "Question",

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "BOLT（Basis of Lightning Technology）是閃電網路的技術規範，確保不同實現間的互通性。主要規範：BOLT #1 基礎協議、BOLT #2 通道管理、BOLT #3 交易格式、BOLT #4 洋蔥路由、BOLT #7 P2P 訊息、BOLT #11 支付請求編碼。所有閃電網路實現（LND、Core Lightning、Eclair）都必須遵循 BOLT 規範才能互相通訊。規範持續更新，新功能如 AMP、Offers 正在標準化中。"
      }
    },
    {
      "@type": "Question",
      "name": "閃電網路通道關閉有哪些方式？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "三種關閉方式：1) 合作關閉（cooperative close）：雙方協商後立即結算，手續費最低，資金即時可用；2) 強制關閉（force close）：單方面廣播最新承諾交易，需等待時間鎖（通常 144-2016 個區塊），手續費較高；3) 懲罰關閉（penalty close）：對方廣播舊狀態時觸發，誠實方可沒收全部通道資金。建議優先使用合作關閉，強制關閉僅在對方離線或不配合時使用。"
      }
    },
    {
      "@type": "Question",

      }
    },
    {
      "@type": "Question",

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "閃電網路的隱私保護機制：1) 洋蔥路由：支付資訊層層加密，中間節點無法得知完整路徑和最終收款人；2) 鏈下交易：只有開關通道上鏈，日常交易不公開；3) 支付雜湊隱私：每筆支付使用不同雜湊，無法關聯；4) 私有通道：不公告的通道不出現在公開圖譜中；5) 隨機路徑選擇：增加追蹤難度。但需注意：通道圖譜公開、節點 IP 可能暴露、流動性分析攻擊風險。"

      "@type": "Question",
      "name": "閃電網路支付失敗的常見原因？",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "閃電支付失敗常見原因：1) 路徑流動性不足：中間通道沒有足夠餘額轉發；2) 節點離線：路徑上的節點暫時不可用；3) Invoice 過期：支付請求已超時；4) 金額過大：超過路徑最大容量；5) 費用不足：提供的費用低於路由節點要求；6) HTLC 數量限制：通道 pending HTLC 達上限。解決方案：重試支付（會嘗試不同路徑）、使用 MPP 拆分支付、增加費用預算、選擇流動性更好的路徑。"
